[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qvex"
version = "0.3.1"
description = "A hyper-compressed graph-vector database for local GraphRAG and multi-agent pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "vector-database",
    "graph-database",
    "rag",
    "graphrag",
    "quantization",
    "sqlite",
    "fts5",
    "bm25",
    "multi-agent",
    "langchain",
    "langgraph",
    "crewai",
    "llamaindex"
]
authors = [
    { name = "Q-VEX Development Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "turbovec>=0.1",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
gliner = [
    "gliner>=1.0",
]
llamaindex = [
    "llama-index-core>=0.10",
]
langchain = [
    "langchain-core>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/your-username/qvex"
Documentation = "https://github.com/your-username/qvex#readme"
Repository = "https://github.com/your-username/qvex.git"
Issues = "https://github.com/your-username/qvex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qvex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
