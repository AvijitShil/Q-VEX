        // Provide the data in the vis format

        var data = {
            nodes: nodes,
            edges: edges
        };
        var options = {
            nodes: {
                borderWidth: 2,
                borderWidthSelected: 4,
                color: {
                    border: '#1557b0',
                    background: '#1a73e8',
                    highlight: {
                        border: '#1557b0',
                        background: '#8ab4f8'
                    }
                }
            },
            edges: {
                arrows: {
                    to: { enabled: true, scaleFactor: 0.8 }
                },
                font: {
                    size: 10,
                    align: 'middle'
                },
                smooth: {
                    type: 'cubicBezier',
                    roundness: 0.5
                }
            },
            physics: {
                barnesHut: {
                    gravitationalConstant: -3000,
                    centralGravity: 0.3,
                    springLength: 150,
                    springConstant: 0.04
                }
            }
        };

        // Initialize network
        var network = new vis.Network(container, data, options);

        // Click handler
        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var nodeData = nodes.get(nodeId);
                
                var entsHtml = "";
                if (nodeData.entities.length > 0) {
                    entsHtml = "<h3>Extracted Entities</h3><div>";
                    nodeData.entities.forEach(function(ent) {
                        entsHtml += "<span class='entity-tag'>" + ent + "</span>";
                    });
                    entsHtml += "</div>";
                } else {
                    entsHtml = "<h3>Extracted Entities</h3><div style='color:gray; font-style:italic;'>No major entities extracted in this small chunk</div>";
                }

                var html = "<div class='node-info'>" +
